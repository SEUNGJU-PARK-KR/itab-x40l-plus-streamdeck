plugins {
    id 'com.android.application'
}

android {
    namespace 'com.itab.deck'
    compileSdk 34

    defaultConfig {
        applicationId 'com.itab.deck'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
}

dependencies {
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
}
